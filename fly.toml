app = "belizeorchids"
primary_region = "dfw"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
  size = "shared-cpu-1x"

[http_service]
  auto_start_machines = true
  auto_stop_machines = "suspend"
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/ping"
