<!DOCTYPE html>
<html class="no-js" lang="">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Belize Orchids</title>
    <meta name="description" content="">
    <meta name="viewport" content=
    "width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Place favicon.ico in the root directory -->

    <link href="{{ static_url_for('static', filename='style.css') }}" rel="stylesheet">
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <!--[if lt IE 8]>
            <p class="browserupgrade">
            You are using an <strong>outdated</strong> browser. Please
            <a href="http://browsehappy.com/">upgrade your browser</a> to improve
            your experience.
            </p>
        <![endif]-->

    <h1>Orchids of Belize</h1>

    <form class="search">
        <input name="q" type="search" placeholder="Search...">
    </form>

    {% for orchid in orchids %}
        <div x-data="{expanded: false}"
             class="orchid">
            <div class="orchid-row">
                <span class="name">{{ orchid['name'] }}</span>
                {% if orchid['images'] | length %}
                    <button x-on:click="expanded = !expanded">
                        <img src="{{ url_for('static', filename='heroicons/camera-mini.svg') }}"
                            width=20
                            height=20>
                    </button>
                {% endif %}
                {% if orchid['wfo_taxon_id'] %}
                    <a href="https://wfoplantlist.org/plant-list/taxon/{{ orchid['wfo_taxon_id'] }}-2023-06"
                    >wfo</a>
                {% endif %}
                {% if orchid['ipni_id'] %}
                    <a href="https://www.ipni.org/n/{{ orchid['ipni_id'] }}"
                    >ipni</a>
                {% endif %}

            </div>
            <div x-show="expanded"
                 x-cloak
                 class="gallery">
                {% for url in orchid['images'] %}
                    <div>
                        <img src="{{thumb_root}}{{url}}"
                             alt="{{orchid['name']}}"
                             loading="lazy">
                    </div>
                {% endfor %}
            </div>
        </div>
    {% endfor %}
</body>
</html>
